name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/docs/package-lock.json
            examples/showcase/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run docs
      - name: Showcase example
        working-directory: examples/showcase
        run: npm ci && npm test && npm run check && npm run build
